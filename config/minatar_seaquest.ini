[base]
env_name = minatar_seaquest

[vec]
total_agents = 8192
num_buffers = 2
num_threads = 0
seed = 42

[env]
sticky_action_prob = 0.1
ramping = 1
max_steps = 0

# Obs is a 10x10x10 grid flattened into the linear encoder (native backend
# has no conv), so hidden_size carries the spatial capacity. MinGRU handles the
# mild partial observability from sticky actions.
[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1

# V-trace async-PPO baseline aligned with config/default.ini. Deviations from the
# project defaults: gamma 0.995->0.99 (MinAtar standard) and ent_coef 0.001->0.01
# (these games need exploration pressure). Tune the rest via the sweep blocks in
# default.ini; the numbers below are a robust starting point, not sweep optima.
[train]
gpus = 1
seed = 42
total_timesteps = 100_000_000
learning_rate = 0.015
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.99
gae_lambda = 0.90
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.01
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 32768
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2
use_rnn = 1

[sweep]
metric = score
goal = maximize

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e7
mean = 1e8
max = 3e8
scale = auto
